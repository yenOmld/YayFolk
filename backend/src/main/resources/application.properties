server.port=8080

spring.jmx.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/yayfolk?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&useUnicode=true&allowMultiQueries=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.database=MYSQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.com.yayfolk.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

image.classifier.service-url=http://127.0.0.1:5001
image.classifier.topk=3
image.classifier.auto-tag-confidence-threshold=0.60

# DeepSeek AI Configuration
deepseek.api-url=https://api.deepseek.com/chat/completions
deepseek.api-key=REDACTED_API_KEY
